<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeSense BLE Dashboard</title>

    <style>
        :root {
            --background: #111827;
            --card: #1f2937;
            --text: #f9fafb;
            --muted: #9ca3af;
            --blue: #2563eb;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #f59e0b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-top: 8px;
            margin-bottom: 30px;
        }

        .status {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #374151;
        }

        .status.connected { border-color: var(--green); }
        .status.error { border-color: var(--red); }

        button {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 10px auto;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #connectButton {
            background: var(--blue);
            color: white;
        }

        #connectButton:hover { background: #1d4ed8; }

        #disconnectButton {
            background: #374151;
            color: white;
            display: none;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: var(--card);
            border-radius: 14px;
            padding: 25px;
            text-align: center;
            min-width: 0;
        }

        .card-title {
            color: var(--muted);
            font-size: 15px;
        }

        .value {
            font-size: 36px;
            font-weight: bold;
            margin-top: 10px;
            overflow-wrap: anywhere;
        }

        .unit {
            color: var(--muted);
            margin-top: 5px;
        }

        .log-container { margin-top: 30px; }

        .log-title {
            color: var(--muted);
            margin-bottom: 8px;
        }

        #log {
            background: #030712;
            border-radius: 10px;
            padding: 15px;
            min-height: 160px;
            max-height: 280px;
            overflow-y: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-family: Consolas, monospace;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .dashboard { grid-template-columns: 1fr; }
            h1 { font-size: 26px; }
        }
    </style>
</head>

<body>
<div class="container">
    <h1>🚲 BikeSense</h1>
    <div class="subtitle">BLE Cycling Sensor Dashboard</div>

    <div id="status" class="status">🔴 Disconnected</div>

    <button id="connectButton">Connect to Bike</button>
    <button id="disconnectButton">Disconnect</button>

    <div class="dashboard">
        <div class="card">
            <div class="card-title">Speed</div>
            <div id="speed" class="value">--</div>
            <div class="unit">mph</div>
        </div>

        <div class="card">
            <div class="card-title">Terrain</div>
            <div id="terrain" class="value">--</div>
            <div class="unit">Classification</div>
        </div>

        <div class="card">
            <div class="card-title">Acceleration X</div>
            <div id="accelX" class="value">--</div>
            <div class="unit">mg</div>
        </div>

        <div class="card">
            <div class="card-title">Acceleration Y</div>
            <div id="accelY" class="value">--</div>
            <div class="unit">mg</div>
        </div>

        <div class="card">
            <div class="card-title">Acceleration Z</div>
            <div id="accelZ" class="value">--</div>
            <div class="unit">mg</div>
        </div>

        <div class="card">
            <div class="card-title">Battery</div>
            <div id="battery" class="value">--</div>
            <div class="unit">percent</div>
        </div>

        <div class="card">
            <div class="card-title">Packet Sequence</div>
            <div id="sequence" class="value">--</div>
            <div class="unit">Telemetry packet</div>
        </div>

        <div class="card">
            <div class="card-title">BLE Connection</div>
            <div id="connection" class="value">OFF</div>
            <div class="unit">Bluetooth</div>
        </div>
    </div>

    <div class="log-container">
        <div class="log-title">BLE Log</div>
        <div id="log">Waiting for connection...</div>
    </div>
</div>

<script>
"use strict";

// Must match the 128-bit UUIDs configured in the EFR32 GATT database.
const BIKE_SERVICE_UUID =
    "dc397372-adde-4d47-8149-7ae4eeeb18fa";

const BIKE_TELEMETRY_UUID =
    "0729d18b-fa96-4e02-a823-ed894186c380";

// Firmware packet format (12 bytes, little-endian):
// 0..1  sequence number: uint16
// 2..3  acceleration X: int16, assumed milli-g
// 4..5  acceleration Y: int16, assumed milli-g
// 6..7  acceleration Z: int16, assumed milli-g
// 8..9  speed: uint16, assumed hundredths of km/h
// 10    battery percentage: uint8
// 11    terrain enum: uint8

const TERRAIN_NAMES = {
    0: "Unknown",
    1: "Road",
    2: "Gravel",
    3: "Trail",
    4: "Off-road"
};

let device = null;
let server = null;
let bikeService = null;
let telemetryCharacteristic = null;

const statusElement = document.getElementById("status");
const connectButton = document.getElementById("connectButton");
const disconnectButton = document.getElementById("disconnectButton");
const speedElement = document.getElementById("speed");
const terrainElement = document.getElementById("terrain");
const accelXElement = document.getElementById("accelX");
const accelYElement = document.getElementById("accelY");
const accelZElement = document.getElementById("accelZ");
const batteryElement = document.getElementById("battery");
const sequenceElement = document.getElementById("sequence");
const connectionElement = document.getElementById("connection");
const logElement = document.getElementById("log");

function log(message) {
    const time = new Date().toLocaleTimeString();
    logElement.textContent += `\n[${time}] ${message}`;
    logElement.scrollTop = logElement.scrollHeight;
    console.log(message);
}

function setStatus(message, type = "") {
    statusElement.textContent = message;
    statusElement.classList.remove("connected", "error");
    if (type) statusElement.classList.add(type);
}

connectButton.addEventListener("click", connectToBike);
disconnectButton.addEventListener("click", disconnectBike);

async function connectToBike() {
    if (!navigator.bluetooth) {
        setStatus("Web Bluetooth is not supported", "error");
        log("Use a Web Bluetooth-compatible browser such as desktop Chrome or Edge.");
        return;
    }

    try {
        log("Opening Bluetooth device picker...");
        setStatus("Select your BikeSense device...");

        // A service filter requires the peripheral to advertise this service UUID.
        device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
                BIKE_SERVICE_UUID
            ]
        });

        log(`Selected device: ${device.name || "Unnamed device"}`);

        device.addEventListener("gattserverdisconnected", handleDisconnect);

        setStatus("Connecting...");
        log("Connecting to GATT server...");

        server = await device.gatt.connect();
        log("GATT connection successful.");

        setStatus("Discovering BikeSense service...");
        bikeService = await server.getPrimaryService(BIKE_SERVICE_UUID);
        log("BikeSense service found.");

        telemetryCharacteristic =
            await bikeService.getCharacteristic(BIKE_TELEMETRY_UUID);
        log("BikeTelemetry characteristic found.");

        // Register the event listener before starting notifications so that
        // the page is ready to receive the first notification.
        telemetryCharacteristic.addEventListener(
            "characteristicvaluechanged",
            handleTelemetry
        );

        await telemetryCharacteristic.startNotifications();
        log("Notifications enabled; subscribed to BikeTelemetry.");

        setStatus(`🟢 Connected to ${device.name || "BikeSense"}`, "connected");
        connectionElement.textContent = "ON";
        connectButton.style.display = "none";
        disconnectButton.style.display = "block";

        log("Waiting for telemetry packets...");
    } catch (error) {
        console.error(error);
        log(`ERROR: ${error.name}: ${error.message}`);
        setStatus("🔴 Connection failed", "error");

        // If connection/discovery/subscription failed partway through,
        // disconnect cleanly and restore the UI.
        if (device && device.gatt && device.gatt.connected) {
            device.gatt.disconnect();
        } else {
            resetUI();
        }
    }
}

function handleTelemetry(event) {
    const data = event.target.value;

    if (data.byteLength !== 12) {
        log(`Unexpected telemetry length: ${data.byteLength} bytes (expected 12).`);
        return;
    }

    const sequence = data.getUint16(0, true);
    const accelX = data.getInt16(2, true);
    const accelY = data.getInt16(4, true);
    const accelZ = data.getInt16(6, true);
    const speedRaw = data.getUint16(8, true);
    const battery = data.getUint8(10);
    const terrainCode = data.getUint8(11);

    // Firmware proposal: speedRaw is hundredths of km/h.
    const speedKmh = speedRaw / 100;
    const speedMph = speedKmh * 0.621371;

    sequenceElement.textContent = sequence;
    accelXElement.textContent = accelX;
    accelYElement.textContent = accelY;
    accelZElement.textContent = accelZ;
    speedElement.textContent = speedMph.toFixed(1);
    batteryElement.textContent = `${battery}%`;
    terrainElement.textContent = TERRAIN_NAMES[terrainCode] ?? `Code ${terrainCode}`;

    log(
        `Telemetry #${sequence}: ` +
        `X=${accelX} mg, Y=${accelY} mg, Z=${accelZ} mg, ` +
        `Speed=${speedKmh.toFixed(2)} km/h (${speedMph.toFixed(1)} mph), ` +
        `Battery=${battery}%, Terrain=${TERRAIN_NAMES[terrainCode] ?? terrainCode}`
    );
}

function disconnectBike() {
    if (device && device.gatt && device.gatt.connected) {
        log("Disconnecting...");
        device.gatt.disconnect();
    } else {
        resetUI();
    }
}

function handleDisconnect() {
    log("BLE device disconnected.");
    resetUI();
}

function resetUI() {
    setStatus("🔴 Disconnected");
    connectionElement.textContent = "OFF";

    speedElement.textContent = "--";
    terrainElement.textContent = "--";
    accelXElement.textContent = "--";
    accelYElement.textContent = "--";
    accelZElement.textContent = "--";
    batteryElement.textContent = "--";
    sequenceElement.textContent = "--";

    connectButton.style.display = "block";
    disconnectButton.style.display = "none";

    if (telemetryCharacteristic) {
        telemetryCharacteristic.removeEventListener(
            "characteristicvaluechanged",
            handleTelemetry
        );
    }

    telemetryCharacteristic = null;
    bikeService = null;
    server = null;
    device = null;
}

if (!navigator.bluetooth) {
    log("Web Bluetooth is unavailable in this browser or context.");
} else {
    log("Web Bluetooth is available. Connect to your BikeSense device.");
}
</script>
</body>
</html>
